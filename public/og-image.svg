<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="100" r="200" fill="#22c55e" fill-opacity="0.1"/>
  <circle cx="100" cy="530" r="150" fill="#22c55e" fill-opacity="0.08"/>

  <!-- Grid pattern overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.05"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Main content area -->
  <g transform="translate(600, 280)">
    <!-- Logo placeholder - Insero text -->
    <text x="0" y="0" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" text-anchor="middle">
      Insero
    </text>

    <!-- Tagline -->
    <text x="0" y="60" fill="white" fill-opacity="0.8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" text-anchor="middle">
      Cloud &amp; Connectivity Consulting
    </text>

    <!-- Accent line -->
    <rect x="-60" y="90" width="120" height="4" rx="2" fill="url(#accent-gradient)"/>

    <!-- Value prop -->
    <text x="0" y="140" fill="#22c55e" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" text-anchor="middle">
      Expert Guidance at Zero Cost
    </text>
  </g>

  <!-- URL at bottom -->
  <text x="600" y="580" fill="white" fill-opacity="0.5" font-family="system-ui, -apple-system, sans-serif" font-size="18" text-anchor="middle">
    insero.cloud
  </text>
</svg>
